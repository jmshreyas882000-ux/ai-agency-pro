<!DOCTYPE html>
<html>
<head>

<section class="hero">
  <h1>AI Digital Marketing Agency</h1>
  <p>Grow your business with AI-powered insights</p>

</section>

<!-- SERVICES -->
<section class="services">

  <div class="cards">
